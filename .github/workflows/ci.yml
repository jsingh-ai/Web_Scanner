name: CI

on:
  push:
  pull_request:

jobs:
  windows-install:
    name: Windows install + native smoke
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22.16 (ABI-match the deploy VM)
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0

      - name: Install dependencies
        # Lockfile is committed as of Phase 2, so use the strict, reproducible install.
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Smoke test (better-sqlite3 + Chromium)
        run: node scripts/ci-smoke.mjs

      - name: Smoke test (data layer)
        run: node scripts/ci-db-smoke.mjs

      - name: Smoke test (scan engine)
        run: node scripts/ci-scan-smoke.mjs

      - name: Smoke test (AI judgment)
        run: node scripts/ci-ai-smoke.mjs

      - name: Smoke test (orchestration end-to-end)
        run: node scripts/ci-orchestration-smoke.mjs

      - name: Smoke test (dashboard server + API + SSRF)
        run: node scripts/ci-server-smoke.mjs
