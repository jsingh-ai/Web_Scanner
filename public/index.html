<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Five Star Sentinel</title>
    <meta name="description" content="Application health monitoring by Five Star." />
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233d4ec4' d='M12 2l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.8 6.1 20.1l1.3-6.6L2.5 8.9l6.6-.8z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M12 2.5l2.7 5.6 6.1.8-4.5 4.3 1.2 6.1L12 16.6l-5.5 2.7 1.2-6.1L3.2 8.9l6.1-.8z"
              fill="#fff"
            />
            <path d="M2.5 15c4-2.4 15-2.4 19 0" stroke="rgba(255,255,255,.7)" stroke-width="1.3" stroke-linecap="round" />
          </svg>
        </span>
        <span class="brand-text">
          <span class="brand-name">Five <span class="star">Star</span> Sentinel</span>
          <span class="brand-sub">Application Health Monitoring</span>
        </span>
      </div>
      <div class="actions">
        <button id="runNowBtn" class="btn btn-primary" title="Run a scan now">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z" stroke-linejoin="round"/></svg>
          Run now
        </button>
        <button id="refreshBtn" class="btn btn-icon btn-ghost" title="Refresh" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="themeBtn" class="btn btn-icon btn-ghost" title="Toggle theme" aria-label="Toggle theme">
          <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
        </button>
        <button id="settingsBtn" class="btn btn-icon btn-ghost" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H10a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V10a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>

    <div class="wrap">
      <!-- Overview -->
      <section class="overview">
        <div class="health-card">
          <div class="gauge">
            <svg viewBox="0 0 120 120">
              <circle cx="60" cy="60" r="52" fill="none" stroke="var(--surface-3)" stroke-width="12" />
              <circle id="gaugeArc" cx="60" cy="60" r="52" fill="none" stroke="var(--ok)" stroke-width="12"
                stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327" style="transition: stroke-dashoffset .6s ease, stroke .3s ease" />
            </svg>
            <div class="gauge-center">
              <span id="gaugePct" class="gauge-pct">—</span>
              <span class="gauge-label">Operational</span>
            </div>
          </div>
          <div id="healthHeadline" class="health-headline">Loading…</div>
        </div>

        <div class="kpis">
          <div class="kpi total">
            <div class="kpi-top"><span class="kpi-label">Total apps</span>
              <span class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
            </div>
            <span class="kpi-value" id="kpiTotal">—</span>
          </div>
          <div class="kpi ok">
            <div class="kpi-top"><span class="kpi-label">Operational</span>
              <span class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </div>
            <span class="kpi-value" id="kpiGood">—</span>
          </div>
          <div class="kpi warn">
            <div class="kpi-top"><span class="kpi-label">Warnings</span>
              <span class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            </div>
            <span class="kpi-value" id="kpiWarn">—</span>
          </div>
          <div class="kpi bad">
            <div class="kpi-top"><span class="kpi-label">Down</span>
              <span class="kpi-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6" stroke-linecap="round"/></svg></span>
            </div>
            <span class="kpi-value" id="kpiDown">—</span>
          </div>
        </div>
      </section>

      <!-- Toolbar -->
      <div class="toolbar">
        <h2>Monitored Applications</h2>
        <div class="tools-right">
          <div class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
            <input id="searchInput" type="search" placeholder="Search apps…" autocomplete="off" />
          </div>
          <div class="segmented" id="filterSeg" role="group" aria-label="Filter by status">
            <button class="seg" data-filter="all" aria-pressed="true">All <span class="count" id="segAll"></span></button>
            <button class="seg" data-filter="good" aria-pressed="false">Operational <span class="count" id="segGood"></span></button>
            <button class="seg" data-filter="warning" aria-pressed="false">Warning <span class="count" id="segWarn"></span></button>
            <button class="seg" data-filter="down" aria-pressed="false">Down <span class="count" id="segDown"></span></button>
          </div>
        </div>
      </div>

      <main id="grid" class="grid" aria-live="polite"></main>
    </div>

    <!-- Settings drawer -->
    <div id="settingsOverlay" class="overlay hidden"></div>
    <aside id="settingsDrawer" class="drawer" aria-hidden="true">
      <div class="drawer-head">
        <h2>Settings — Monitored Apps</h2>
        <button id="settingsClose" class="btn btn-icon btn-ghost" aria-label="Close">✕</button>
      </div>
      <div class="drawer-body">
        <div class="token-field field">
          <label for="tokenInput">Write token <span class="hint">(required to add/edit/delete if the server is configured with one)</span></label>
          <input id="tokenInput" type="password" placeholder="paste write token" autocomplete="off" />
        </div>

        <form id="appForm" class="form-card">
          <input type="hidden" id="appId" />
          <div class="row">
            <div class="field grow">
              <label for="name">Name</label>
              <input id="name" required maxlength="200" placeholder="e.g. OPC Polytex" />
            </div>
          </div>
          <div class="field">
            <label for="url">URL</label>
            <input id="url" required placeholder="e.g. http://10.0.0.5/dashboard" />
          </div>
          <div class="row">
            <label class="check"><input type="checkbox" id="isRich" /> Rich dashboard (use vision + section breakdown)</label>
          </div>
          <div class="field">
            <label for="sections">Sections <span class="hint">(comma-separated, dashboards only)</span></label>
            <input id="sections" placeholder="Pinch, Lamination, Totani, Bottomer, Extruder" />
          </div>
          <details class="advanced">
            <summary>Advanced load options</summary>
            <div class="row" style="margin-top:10px">
              <div class="field">
                <label for="waitStrategy">Wait strategy</label>
                <select id="waitStrategy">
                  <option value="load">load (default)</option>
                  <option value="domcontentloaded">domcontentloaded</option>
                  <option value="networkidle">networkidle (avoid for live dashboards)</option>
                </select>
              </div>
              <div class="field">
                <label for="settleMs">Settle (ms)</label>
                <input id="settleMs" type="number" min="0" max="120000" placeholder="3000" />
              </div>
              <div class="field">
                <label for="timeoutMs">Timeout (ms)</label>
                <input id="timeoutMs" type="number" min="1000" max="300000" placeholder="30000" />
              </div>
            </div>
            <div class="field" style="margin-top:6px">
              <label for="waitSelector">Readiness selector <span class="hint">(optional CSS selector)</span></label>
              <input id="waitSelector" placeholder="e.g. .tile, #root .loaded" />
            </div>
          </details>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="saveBtn">Add app</button>
            <button type="button" class="btn" id="cancelEdit">Cancel</button>
            <span id="formMsg" class="form-msg"></span>
          </div>
        </form>

        <div class="list-title">Current apps</div>
        <div class="apps-list" id="appsList"></div>
      </div>
    </aside>

    <!-- Screenshot lightbox -->
    <div id="shotOverlay" class="lightbox hidden">
      <button id="shotClose" class="btn btn-icon close" aria-label="Close">✕</button>
      <img id="shotImg" alt="Screenshot" />
    </div>

    <!-- Toasts -->
    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="/app.js"></script>
  </body>
</html>
