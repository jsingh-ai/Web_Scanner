<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Five Star Sentinel</title>
    <meta name="description" content="Application health monitoring by Five Star." />
    <link rel="stylesheet" href="/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%233d4ec4' d='M12 2l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.8 6.1 20.1l1.3-6.6L2.5 8.9l6.6-.8z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="app" id="app" data-collapsed="false" data-mobilenav="closed">
      <div class="mobilebar">
        <button id="menuToggle" class="icon-btn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18" stroke-linecap="round"/></svg>
        </button>
        <span class="brand-name">Five <span class="star">Star</span> Sentinel</span>
        <button id="runNowMobile" class="icon-btn primary" aria-label="Run now">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z" stroke-linejoin="round"/></svg>
        </button>
      </div>

      <aside class="sidebar" id="sidebar">
        <div class="side-brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <path d="M12 2.5l2.7 5.6 6.1.8-4.5 4.3 1.2 6.1L12 16.6l-5.5 2.7 1.2-6.1L3.2 8.9l6.1-.8z" fill="#fff" />
              <path d="M2.5 15c4-2.4 15-2.4 19 0" stroke="rgba(255,255,255,.7)" stroke-width="1.3" stroke-linecap="round" />
            </svg>
          </span>
          <span class="brand-label">
            <span class="brand-name">Five <span class="star">Star</span> Sentinel</span>
            <span class="brand-sub">App Health Monitoring</span>
          </span>
        </div>

        <nav class="side-nav">
          <button id="runNowBtn" class="side-item primary" title="Run a scan now">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 3l14 9-14 9V3z" stroke-linejoin="round"/></svg>
            <span class="lbl">Run now</span>
          </button>
          <button id="addSiteBtn" class="side-item" title="Add a site">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            <span class="lbl">Add site</span>
          </button>
        </nav>

        <div class="side-foot">
          <div class="side-health" title="Overall health">
            <span class="dot" id="sideDot"></span>
            <span class="lbl" id="sideHealth">—</span>
          </div>
          <button id="themeBtn" class="side-item" title="Toggle theme">
            <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"></svg>
            <span class="lbl">Theme</span>
          </button>
          <button id="collapseToggle" class="side-item collapse-toggle" title="Collapse sidebar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span class="lbl">Collapse</span>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="page-header">
          <div class="ph-left">
            <h1 class="ph-title">Overview</h1>
            <span class="ph-sub" id="pageSub">Loading…</span>
          </div>
          <button class="btn btn-primary ph-add" id="addSiteHeader">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
            Add site
          </button>
        </header>

        <section class="overview">
          <div class="stat health">
            <div class="gauge">
              <svg viewBox="0 0 120 120">
                <circle cx="60" cy="60" r="52" fill="none" stroke="var(--surface-3)" stroke-width="11" />
                <circle id="gaugeArc" cx="60" cy="60" r="52" fill="none" stroke="var(--ok)" stroke-width="11" stroke-linecap="round" stroke-dasharray="327" stroke-dashoffset="327" style="transition: stroke-dashoffset .6s ease, stroke .3s ease" />
              </svg>
              <div class="gauge-center"><span id="gaugePct" class="gauge-pct">—</span><span class="gauge-label">Operational</span></div>
            </div>
            <div id="healthHeadline" class="health-headline">Loading…</div>
          </div>
          <div class="stat total">
            <div class="stat-head"><span class="stat-label">Total sites</span><span class="stat-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span></div>
            <div class="stat-value" id="kpiTotal">—</div>
          </div>
          <div class="stat ok">
            <div class="stat-head"><span class="stat-label">Operational</span><span class="stat-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
            <div class="stat-value" id="kpiGood">—</div>
          </div>
          <div class="stat warn">
            <div class="stat-head"><span class="stat-label">Warnings</span><span class="stat-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 9v4m0 4h.01M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z" stroke-linecap="round" stroke-linejoin="round"/></svg></span></div>
            <div class="stat-value" id="kpiWarn">—</div>
          </div>
          <div class="stat bad">
            <div class="stat-head"><span class="stat-label">Down</span><span class="stat-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6" stroke-linecap="round"/></svg></span></div>
            <div class="stat-value" id="kpiDown">—</div>
          </div>
        </section>

        <div class="toolbar">
          <h2>Monitored Sites</h2>
          <div class="tools-right">
            <div class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3" stroke-linecap="round"/></svg>
              <input id="searchInput" type="search" placeholder="Search sites…" autocomplete="off" />
            </div>
            <div class="segmented" id="filterSeg" role="group" aria-label="Filter by status">
              <button class="seg" data-filter="all" aria-pressed="true">All <span class="count" id="segAll"></span></button>
              <button class="seg" data-filter="good" aria-pressed="false">Operational <span class="count" id="segGood"></span></button>
              <button class="seg" data-filter="warning" aria-pressed="false">Warning <span class="count" id="segWarn"></span></button>
              <button class="seg" data-filter="down" aria-pressed="false">Down <span class="count" id="segDown"></span></button>
            </div>
          </div>
        </div>

        <section id="grid" class="grid" aria-live="polite"></section>
      </main>
    </div>

    <div class="nav-scrim" id="navScrim"></div>

    <!-- Add / edit site drawer -->
    <div id="settingsOverlay" class="overlay hidden"></div>
    <aside id="settingsDrawer" class="drawer" aria-hidden="true">
      <div class="drawer-head">
        <h2 id="drawerTitle">Add a site</h2>
        <button id="settingsClose" class="icon-btn ghost" aria-label="Close">✕</button>
      </div>
      <div class="drawer-body">
        <div id="tokenSaved" class="token-saved hidden">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Write access unlocked · <button type="button" id="changeToken" class="linklike">change</button>
        </div>
        <div class="token-field field" id="tokenField">
          <label for="tokenInput">Write token <span class="hint">(required to add/edit/delete if the server is configured with one)</span></label>
          <input id="tokenInput" type="password" placeholder="paste write token" autocomplete="off" />
        </div>

        <form id="appForm" class="form-card">
          <input type="hidden" id="appId" />
          <div class="field">
            <label for="name">Name</label>
            <input id="name" required maxlength="200" placeholder="e.g. OPC Polytex" />
          </div>
          <div class="field">
            <label for="url">URL</label>
            <input id="url" required placeholder="e.g. http://10.0.0.5/dashboard" />
          </div>
          <div class="field">
            <label for="description">Description <span class="hint">(optional)</span></label>
            <input id="description" maxlength="1000" placeholder="e.g. Press-room timers, Line 3" />
          </div>
          <div class="field">
            <label>Monitoring type</label>
            <div class="toggle-group" id="typeToggle" role="group" aria-label="Monitoring type">
              <button type="button" class="toggle" data-rich="false" aria-pressed="true"><strong>Plain</strong><small>Just check it loads (fast, free)</small></button>
              <button type="button" class="toggle" data-rich="true" aria-pressed="false"><strong>Rich dashboard</strong><small>AI reads it + section breakdown</small></button>
            </div>
            <input type="hidden" id="isRich" value="false" />
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="saveBtn">Add site</button>
            <button type="button" class="btn" id="cancelEdit">Cancel</button>
            <button type="button" class="btn btn-danger hidden" id="deleteSiteBtn">Delete</button>
            <span id="formMsg" class="form-msg"></span>
          </div>
        </form>

        <div id="tabsPanel" class="tabs-panel hidden">
          <div class="tabs-head">
            <span class="list-title" id="tabsTitle">Tabs</span>
            <button type="button" class="btn" id="scanTabsBtn">Scan tabs</button>
          </div>
          <div id="tabsScanMsg" class="form-msg"></div>
          <div id="candidatesBox" class="candidates hidden">
            <div class="hint">Found tabs — pick which to monitor:</div>
            <div id="candidatesList" class="cand-list"></div>
            <button type="button" class="btn btn-primary" id="addSelectedBtn">Add selected</button>
          </div>
          <div id="viewsList" class="views-list"></div>
          <div class="manual-add">
            <input id="tabLabel" placeholder="Tab name" />
            <input id="tabUrl" placeholder="Tab URL (http://…)" />
            <button type="button" class="btn" id="addTabBtn">Add</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Screenshot lightbox (zoom + pan) -->
    <div id="shotOverlay" class="lightbox hidden">
      <div class="lb-tools">
        <button id="lbOut" class="icon-btn ghost" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14" stroke-linecap="round"/></svg></button>
        <button id="lbReset" class="btn" aria-label="Reset zoom">Fit</button>
        <button id="lbIn" class="icon-btn ghost" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg></button>
        <button id="shotClose" class="icon-btn ghost close" aria-label="Close">✕</button>
      </div>
      <div class="lb-stage" id="lbStage"><img id="shotImg" alt="Screenshot" draggable="false" /></div>
      <div class="lb-hint">Scroll to zoom · drag to pan</div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>

    <script src="/app.js"></script>
  </body>
</html>
